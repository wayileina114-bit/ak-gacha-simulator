<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>明日方舟 干员寻访模拟器</title>
<style>
:root{
  --bg:#0b111c; --bg2:#101a2b; --panel:#141f33; --panel2:#1a2740;
  --line:#2a3a5a; --txt:#d8e2f2; --dim:#7d8fb0; --acc:#ff9a2e; --acc2:#4ab3ff;
  --r3:#9aa7b8; --r4:#4a9bf5; --r5:#f5b94a; --r6:#ff5d3a;
  --gold:#ffd76a; --red:#ff4d4d;
}
body.theme-blue{
  --bg:#081120; --bg2:#0c1a30; --panel:#10243c; --panel2:#15304e;
  --line:#1e3f60; --txt:#dcebff; --dim:#7fa3cc; --acc:#8fd8ff; --acc2:#4ab3ff;
}
body.theme-blue header{background:linear-gradient(90deg,#0d2440 0%,#112c4d 55%,#163a5e 100%)}
body.theme-amber{
  --bg:#17100a; --bg2:#20160b; --panel:#2b1d0f; --panel2:#392a16;
  --line:#5c4528; --txt:#f3e6d2; --dim:#c0a888; --acc:#ffb45e; --acc2:#ff9a2e;
}
body.theme-amber header{background:linear-gradient(90deg,#2c1a08 0%,#36220c 55%,#402d14 100%)}
body.theme-blue header::after{background:radial-gradient(circle, rgba(120,200,255,.16), transparent 70%)}
body.theme-blue .bcard.active{border-color:var(--acc); background:linear-gradient(90deg, rgba(74,179,255,.16), var(--bg2))}
body.theme-amber header::after{background:radial-gradient(circle, rgba(255,180,94,.16), transparent 70%)}
body.theme-amber .bcard.active{border-color:var(--acc); background:linear-gradient(90deg, rgba(255,154,46,.16), var(--bg2))}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(74,179,255,.08), transparent 60%),
    radial-gradient(900px 400px at 10% 110%, rgba(255,154,46,.06), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 2px, transparent 2px 14px);
}
#app{position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:14px}
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 16px; background:linear-gradient(90deg,#1a2a4a 0%,#16233d 55%,#241a3d 100%); position:relative; overflow:hidden;
  border:1px solid var(--line); border-radius:12px; margin-bottom:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
header::after{content:''; position:absolute; top:-40%; right:-10%; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(255,184,77,.12), transparent 70%); pointer-events:none}
}
.logo{font-size:22px; font-weight:800; letter-spacing:2px; color:#fff}
.logo span{color:var(--acc); font-weight:600; font-size:14px; letter-spacing:4px; margin-left:6px}
.hright{margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.utilbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
#utilToggle{display:none}
.currency{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim)}
.currency b{color:var(--acc); font-size:16px; min-width:52px; text-align:right}
.mini-btn{
  padding:5px 12px; border-radius:8px; cursor:pointer; font-size:12px;
  background:var(--panel2); border:1px solid var(--line); color:var(--acc2); font-family:inherit; transition:.15s;
}
.mini-btn:hover{border-color:var(--acc2); color:#fff}
.mini-btn.warn{color:var(--red)}
.mini-btn.warn:hover{border-color:var(--red)}
.mini-btn:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.mini-btn.on{background:var(--acc2); border-color:var(--acc2); color:#fff}
.mini-btn.off{background:rgba(120,140,180,.15); border-color:var(--line); color:var(--dim)}
#layout{display:grid; grid-template-columns:340px 1fr; gap:12px; align-items:start}
@media(max-width:1000px){#layout{grid-template-columns:1fr}}
.sidebar{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:12px; max-height:calc(100vh - 130px); overflow:hidden;
  display:flex; flex-direction:column; position:sticky; top:12px;
}
.sidebar h3{font-size:14px; color:var(--acc2); margin-bottom:8px; letter-spacing:2px}
.sidehead{display:flex; align-items:center; justify-content:space-between; gap:8px}
.sidehead h3{flex:1}
.heat{display:grid; grid-template-columns:repeat(auto-fill,minmax(16px,1fr)); gap:3px; margin-top:8px}
.hcell{height:16px; border-radius:3px; background:#0d1626}
.hcell.l1{background:#2a4a7a}
.hcell.l2{background:#4a9bd6}
.hcell.l3{background:#ffd76a}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
#opProfChips .chip{border-color:rgba(201,161,74,.35); color:#c9a14a}
#opProfChips .chip.on{background:#c9a14a; border-color:#c9a14a; color:#0d1526}
.chip{
  padding:4px 10px; border-radius:14px; font-size:12px; cursor:pointer;
  background:var(--panel2); border:1px solid var(--line); color:var(--dim); font-family:inherit; transition:.15s;
}
.chip:hover{color:var(--txt)}
.chip.on{background:var(--acc2); border-color:var(--acc2); color:#fff; font-weight:700}
#searchBox{
  width:100%; padding:8px 10px; border-radius:8px; margin-bottom:8px;
  background:var(--bg2); border:1px solid var(--line); color:var(--txt); font-family:inherit; font-size:13px;
}
#searchBox:focus{outline:none; border-color:var(--acc2)}
#bannerList{overflow-y:auto; flex:1; padding-right:4px}
#bannerList::-webkit-scrollbar{width:6px}
#bannerList::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.bcard{
  display:flex; gap:10px; align-items:center; padding:8px 10px; margin-bottom:6px;
  background:var(--bg2); border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:.15s;
}
.bcard:hover{border-color:var(--acc2); transform:translateX(2px)}
.bcard.on{border-color:var(--acc); background:linear-gradient(90deg, rgba(255,154,46,.12), var(--bg2))}
.bcard.active{border-left:3px solid #4ade80}
.bcard .thumb{display:flex; gap:2px; min-width:64px}
.bcard .thumb img{width:30px; height:30px; border-radius:6px; object-fit:cover; border:1px solid var(--line)}
.bcard .meta{flex:1; min-width:0}
.bcard .name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bcard .sub{font-size:11px; color:var(--dim); margin-top:2px}
.badge{
  display:inline-block; padding:1px 7px; border-radius:8px; font-size:10px; margin-left:6px;
  color:#fff; vertical-align:1px;
}
.now-badge{display:inline-block; padding:1px 7px; border-radius:8px; font-size:10px; margin-left:6px; background:var(--gold); color:#000; font-weight:800; vertical-align:1px}
.srcLink{color:var(--acc2); cursor:pointer; margin-right:2px; text-decoration:none; border-bottom:1px dashed rgba(74,179,255,.35); transition:color .15s, border-color .15s}
.srcLink.active{border-bottom-color:#4ade80; color:#6ee7b7}
.srcLink.active b{animation:dotpulse 1.2s infinite}
@keyframes dotpulse{0%,100%{opacity:.6}50%{opacity:1}}
.srcLink:hover{text-decoration:none; color:#fff; border-bottom-color:var(--acc)}
.drawerClose{display:none; float:right; cursor:pointer; color:var(--dim); font-size:15px}
.drawerClose:hover{color:#fff}
.favbtn{color:#3a4d75; cursor:pointer; font-size:14px; margin-left:8px; transition:.2s}
.favbtn:hover{color:var(--gold); transform:scale(1.2)}
.favbtn.on{color:var(--gold); text-shadow:0 0 8px rgba(255,215,106,.6)}
.main{display:flex; flex-direction:column; gap:12px; min-width:0}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px}
#bannerInfo .row1{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
#bannerInfo h2{font-size:20px; color:#fff; letter-spacing:1px}
#bannerInfo .dates{font-size:12px; color:var(--dim)}
.rateup{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap}
.rup-card{
  width:120px; border-radius:10px; overflow:hidden; position:relative; cursor:pointer;
  border:2px solid var(--line); background:var(--bg2); transition:.2s;
}
.rup-card:hover{transform:translateY(-3px)}
.rup-card img{width:100%; height:150px; object-fit:cover; object-position:top; display:block}
.rup-card .rn{
  position:absolute; left:0; right:0; bottom:0; padding:14px 4px 4px; text-align:center;
  font-size:12px; font-weight:700; color:#fff;
  background:linear-gradient(transparent, rgba(0,0,0,.85));
}
.rup-card .rb{position:absolute; top:4px; left:4px; font-size:10px; padding:1px 6px; border-radius:8px; background:rgba(0,0,0,.6); color:var(--gold)}
.rup-card .rr{position:absolute; top:4px; right:4px; font-size:10px; padding:1px 6px; border-radius:8px; background:rgba(0,0,0,.6); color:#fff}
.rup-card.r6{border-color:var(--r6); box-shadow:0 0 14px rgba(255,93,58,.4)}
.rup-card.r6 .rb.lim{background:linear-gradient(90deg,#d64a4a,#ff8a5c); color:#fff}
.rup-card.r5{border-color:var(--r5); box-shadow:0 0 10px rgba(245,185,74,.25)}
.notice{font-size:12px; color:var(--dim); margin-top:8px; line-height:1.7}
.notice b{color:var(--acc)}
.selbox{margin-top:12px; padding:10px; background:var(--bg2); border:1px solid var(--line); border-radius:10px}
.seltitle{font-size:12px; color:var(--acc2); margin-bottom:8px}
.selgrid{display:flex; gap:8px; flex-wrap:wrap}
.selop{
  width:64px; border-radius:8px; overflow:hidden; cursor:pointer; text-align:center;
  border:2px solid var(--line); background:var(--panel2); transition:.15s; position:relative;
}
.selop img{width:100%; height:64px; object-fit:cover; object-position:top; display:block}
.selop .sn{font-size:10px; padding:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.selop.on{border-color:var(--gold); box-shadow:0 0 10px rgba(255,215,106,.4)}
.selop.on::after{content:"✓"; position:absolute; top:2px; right:2px; width:16px; height:16px; line-height:16px; text-align:center; font-size:11px; font-weight:800; background:var(--gold); color:#000; border-radius:50%}
.selop.off{opacity:.5}
.pitybar{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12px; color:var(--dim)}
.pityurgent{background:linear-gradient(90deg,rgba(255,93,58,.18),rgba(255,154,46,.14)); border:1px solid rgba(255,93,58,.5); color:#ffb39e; border-radius:10px; padding:8px 12px; margin-top:10px; font-size:13px; font-weight:700; text-align:center; animation:urgentpulse 1.6s infinite}
@keyframes urgentpulse{0%,100%{box-shadow:0 0 6px rgba(255,93,58,.2)}50%{box-shadow:0 0 18px rgba(255,93,58,.5)}}
.pitybar .pbar{flex:1; max-width:260px; height:6px; background:#0a1220; border-radius:3px; overflow:hidden}
.pitybar .pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--r6),var(--acc)); width:0%; transition:.3s; background-size:200% 100%; animation:pbars 2.2s linear infinite}
@keyframes pbars{0%{background-position:0% 0}100%{background-position:200% 0}}
.pitybar b{color:var(--r6)}
#cards.fast .card{transition:transform .15s}
.spark{display:flex; align-items:center; gap:10px; margin-top:10px; padding:10px; background:var(--bg2); border-radius:10px; border:1px solid var(--line)}
.spark .bar{flex:1; height:8px; background:#0a1220; border-radius:4px; overflow:hidden}
.spark .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--acc)); width:0%; transition:.3s}
.spark b{color:var(--gold); font-size:14px}
.spark .sparkhint{font-size:11px; color:var(--dim); white-space:nowrap}
.spark .sparkhint b{color:var(--acc)}
.spark .sparkhint.done{color:#4ade80}
.spark .sparkhint.done b{color:#4ade80}
.spark .mini-btn:disabled{opacity:.4; cursor:not-allowed}
#gacha .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.pull-btn{
  padding:12px 34px; font-size:17px; font-weight:800; letter-spacing:2px; border-radius:12px; cursor:pointer;
  border:none; color:#fff; font-family:inherit; transition:.2s; position:relative; overflow:hidden;
}
.pull-btn.single{background:linear-gradient(135deg,#2a4a7a,#1c3050)}
.pull-btn.ten{background:linear-gradient(135deg,#ff9a2e,#ff5d3a); box-shadow:0 6px 24px rgba(255,93,58,.35)}
.pull-btn:hover{transform:translateY(-2px); filter:brightness(1.1)}
.pull-btn:active{transform:translateY(0)}
.pull-btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.pull-btn:disabled:hover{filter:none; transform:none}
.pull-btn .cost{display:block; font-size:11px; font-weight:400; letter-spacing:0; opacity:.85}
#cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:12px; min-height:176px; perspective:900px}
.card{
  position:relative; height:176px; border-radius:10px; cursor:pointer;
  transform-style:preserve-3d; transition:transform .5s;
}
.card.flip{transform:rotateY(180deg) scale(1.03); transition:transform .45s cubic-bezier(.2,.8,.25,1.1)}
.card .face{
  position:absolute; inset:0; border-radius:10px; backface-visibility:hidden;
  overflow:hidden; border:2px solid var(--line); background:var(--bg2);
}
.card .back{
  display:flex; align-items:center; justify-content:center; font-size:34px; color:#3a4d75;
  background:
    repeating-linear-gradient(45deg, rgba(74,179,255,.05) 0 8px, transparent 8px 16px),
    linear-gradient(160deg,#1a2740,#0e1828);
}
.card .front{transform:rotateY(180deg)}
.card .front img{width:100%; height:100%; object-fit:cover; object-position:top}
.card .nm{
  position:absolute; left:0; right:0; bottom:0; padding:16px 4px 5px; text-align:center;
  font-size:12px; font-weight:700; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.9));
}
.card .st{position:absolute; top:4px; left:4px; font-size:11px; color:var(--gold); font-weight:700; text-shadow:0 1px 3px #000}
.card .newtag{position:absolute; top:4px; right:4px; font-size:10px; padding:1px 6px; border-radius:8px; background:var(--red); color:#fff; font-weight:700}
.card.r3 .front{border-color:var(--r3)}
.card.r4 .front{border-color:var(--r4)}
.card.r5 .front{border-color:var(--r5); box-shadow:0 0 16px rgba(245,185,74,.35)}
.card.r6 .front{border-color:var(--r6); box-shadow:0 0 26px rgba(255,93,58,.55); animation:glow 1.2s infinite; background:linear-gradient(160deg,rgba(60,10,10,.55),rgba(20,6,14,.9))}
.card.r6 .front img{filter:saturate(1.18) contrast(1.05)}
@keyframes glow{
  0%,100%{box-shadow:0 0 20px rgba(255,93,58,.45)}
  50%{box-shadow:0 0 40px rgba(255,157,46,.85)}
}
#resultMsg{text-align:center; font-size:14px; color:var(--dim); margin-top:10px; min-height:20px}
.notice b{color:var(--acc)}
.luckbadge{display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:14px; background:linear-gradient(135deg,rgba(255,154,46,.18),rgba(74,179,255,.12)); border:1px solid var(--line); margin-bottom:8px}
.luckbadge.lv1{background:linear-gradient(135deg,rgba(120,130,160,.2),rgba(80,90,120,.15))}
.luckbadge.lv2{background:linear-gradient(135deg,rgba(90,140,220,.2),rgba(60,100,180,.15))}
.luckbadge.lv3{background:linear-gradient(135deg,rgba(120,190,120,.2),rgba(70,150,90,.15))}
.luckbadge.lv4{background:linear-gradient(135deg,rgba(255,170,60,.25),rgba(255,120,40,.18))}
.luckbadge.lv5{background:linear-gradient(135deg,rgba(255,215,106,.3),rgba(255,150,50,.22)); border-color:var(--gold)}
.luckbadge .lb-score{font-size:34px; font-weight:900; color:var(--gold); min-width:64px; text-align:center; text-shadow:0 0 14px rgba(255,215,106,.5)}
.luckbadge .lb-label{font-size:15px; font-weight:700; color:var(--txt)}
.luckdetail{margin-bottom:10px}
.ld-row{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); margin-bottom:5px}
.ld-row span{width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ld-row b{color:var(--acc); min-width:42px; text-align:right}
.ld-bar{flex:1; height:5px; background:var(--bg); border-radius:3px; overflow:hidden}
.ld-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:3px}
.pitymap{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; max-height:56vh; overflow-y:auto}
.pitymap-card{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; transition:transform .15s, border-color .15s}
.pitymap-card:hover{border-color:var(--acc2); transform:translateY(-2px)}
.pitymap-card.on{border-color:var(--acc)}
.pitymap-card .pm-name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pitymap-card .pm-bar{height:6px; background:var(--bg); border-radius:3px; overflow:hidden; margin:6px 0 4px}
.pitymap-card .pm-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:3px}
.pitymap-card .pm-sub{font-size:11px; color:var(--dim); line-height:1.6}
.pitymap-card .pm-hot{color:var(--red); font-weight:700}
.rup-card.owned{opacity:.45; filter:grayscale(.6); cursor:not-allowed}
#fortune.busy{color:var(--gold); font-weight:700; animation:urgentpulse 1s infinite}
.sixstrip{display:flex; justify-content:center; gap:10px; margin:6px 0 10px; flex-wrap:wrap}
.sixcard{width:110px; border-radius:10px; overflow:hidden; border:2px solid var(--r6); box-shadow:0 0 16px rgba(255,93,58,.4); cursor:pointer; transition:transform .15s; position:relative}
.sixcard.lim{border-color:#ffd700; box-shadow:0 0 22px rgba(255,215,0,.55)}
.sixcard .crown{position:absolute; top:2px; right:2px; font-size:14px; z-index:2; filter:drop-shadow(0 0 4px rgba(255,215,0,.8))}
.sixcard:hover{transform:translateY(-3px) scale(1.03)}
.sixcard img{width:100%; height:130px; object-fit:cover; object-position:top; display:block}
.sixcard .sn6{font-size:11px; text-align:center; color:#ffd7b0; padding:3px 0; background:linear-gradient(180deg,rgba(60,10,10,.8),rgba(30,8,14,.95)); font-weight:800}
#resultMsg .newline{color:var(--acc); font-weight:800; font-size:15px; text-shadow:0 0 12px rgba(74,179,255,.4)}
#resultMsg .wishhit{color:#ff6ec7; font-weight:800; font-size:15px; text-shadow:0 0 12px rgba(255,110,199,.45)}
#resultMsg .batchrate{color:var(--dim); font-size:12px}
#resultMsg .batchrate b{color:var(--acc); font-size:13px}
.cop .wishmark{position:absolute; top:10px; left:1px; font-size:9px; z-index:2}
.cop .quickwish{position:absolute; top:1px; right:1px; background:rgba(0,0,0,.65); border:1px solid rgba(255,110,199,.5); color:#ff6ec7; font-size:10px; border-radius:8px; padding:1px 5px; cursor:pointer; z-index:3; transition:transform .15s}
.cop .quickwish:hover{transform:scale(1.15); background:rgba(255,110,199,.25)}
.cop.wished{border-color:rgba(255,110,199,.55); box-shadow:0 0 10px rgba(255,110,199,.22)}
#resultMsg b{color:var(--gold); font-size:16px}
#btnAgain{margin-top:10px; background:linear-gradient(90deg,rgba(255,154,46,.25),rgba(255,93,58,.2)); border-color:var(--gold); color:var(--gold); font-weight:800}
.allreslink{color:var(--acc); cursor:pointer; text-decoration:underline}
.allreslink:hover{color:#fff}
#btnRandOp{transition:transform .2s}
#btnRandOp:active{transform:rotate(20deg) scale(.95)}
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:10px}
.statbar{height:5px; background:var(--bg); border-radius:3px; overflow:hidden; margin-top:6px}
.statbar i{display:block; height:100%; background:linear-gradient(90deg,#ff6ec7,#c96ab6); border-radius:3px}
.stat{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center}
.stat .v{font-size:22px; font-weight:800; color:var(--acc2)}
.stat .k{font-size:11px; color:var(--dim); margin-top:2px}
.stat .v.gold{color:var(--gold)}
.stat .v.red{color:var(--red)}
.stat .v.orange{color:var(--acc)}
.sectbar{display:flex; align-items:center; gap:10px; margin:14px 0 8px}
.sectbar h4{font-size:13px; color:var(--acc2); letter-spacing:2px; border-left:3px solid var(--acc2); padding-left:8px; margin:0}
.sectbar .mini-btn{margin-left:auto}
#history{max-height:220px; overflow-y:auto}
.hitem{display:flex; align-items:center; gap:8px; padding:4px 8px; font-size:12px; border-radius:6px}
.hitem:nth-child(odd){background:rgba(255,255,255,.02)}
.hitem .star{color:var(--gold)}
.hitem.r6 .star{color:var(--r6); font-weight:800}
.hitem.r5 .star{color:var(--r5)}

function jsonp(url,cb,timeout){

function relTime(t){

  var day=Math.floor(h/24);
  if(day<30)return day+'天前';
  var dt=new Date(t);
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}

  state.pity={};
  state.spark={};
  state.opCnt={};
  state.cnt={};
  state.wish=[];
  save();
  renderStats(); renderHistory(); renderCollection(); renderBannerInfo();
  toast('已清空记录');
}
function toggleSpeed(){
  if(SPEED>100)SPEED=30;
  else if(SPEED>0)SPEED=0;
  else SPEED=160;
  var cardsEl=$('cards'); if(cardsEl)cardsEl.classList.toggle('fast',SPEED<=100);
  var btn=$('btnSpeed'); if(!btn)return;
  btn.textContent=SPEED>100?'动画: 慢速':(SPEED===0?'动画: 关闭':'动画: 快速');
  btn.classList.toggle('on',SPEED!==160);
  btn.classList.toggle('off',SPEED===0);
  if(SPEED===0&&cardsEl){ cardsEl.querySelectorAll('.card').forEach(function(c){ if(c.classList&&!c.classList.contains('flip'))c.classList.add('flip'); }); }
}
function init(){
  var bs=DATA.banners, i;
  if(!state.cur||!bannerById(state.cur))state.cur=bs[0].id;
  if(!state.history.length&&!state.collection.length){ setTimeout(function(){ toast('👋 欢迎！选择卡池后点击抽卡开始 · 快捷键 1/2/3 · ←/→ 切换卡池'); }, 800); }
  initFilters();
  renderBannerList();
  renderBannerInfo();
  renderStats();
  renderHistory();
  renderCollection();
  setFortune();
  wire('btn1',function(){ doPull(1); });
  wire('btn10',function(){ doPull(10); });
  wire('btnUntil6',function(){ doUntil6(); });
  wire('btnCustom',function(){ var v=parseInt($('customN').value,10); if(!v||isNaN(v))v=50; doPull(Math.min(500,Math.max(1,v))); });
  wire('btn50',function(){ doPull(50); });
  wire('btn100',function(){ doPull(100); });
  wire('btn200',function(){ doPull(200); });
  wire('btnStats',openStats);
  wire('btnPityMap',openPityMap);
  wire('btnOpStats',openOpStats);
  wire('btnCopyStats',copyStats);
  wire('btnRules',openRules);
  wire('btnGallery',openGallery);
  wire('btnRandOp',function(){ var keys=Object.keys(opByName); if(!keys.length)return; openModal(keys[Math.floor(Math.random()*keys.length)]); });
  wire('btnAch',openAch);
  wire('btnExportHist',exportHistory);
  wire('btnRandom',randomBanner);
  wire('btnResetFilters',resetFilters);
  wire('btnExportBanners',exportBanners);
  var csb=$('colSearch'); var csDl=null;
  if(csb)csb.oninput=function(){ clearTimeout(csDl); var v=this.value; csDl=setTimeout(function(){ colSearch=v.trim(); renderCollection(); },150); };
  wire('mBackdrop',closeDrawer);
  wire('drawerClose',closeDrawer);
  wire('utilToggle',function(){ var ub=$('utilBar'); if(ub)ub.classList.toggle('show'); });
  wire('btnSpeed',toggleSpeed);
  wire('btnSound',toggleSound);
  wire('btnTheme',nextTheme);
  applyTheme();
  wire('btnExport',exportSave);
  wire('btnImport',importSave);
  wire('btnReset',resetAll);
  wire('btnReset2',clearHistory);
  var sb=$('searchBox'); var sbDl=null;
  if(sb)sb.oninput=function(){ clearTimeout(sbDl); var v=this.value; sbDl=setTimeout(function(){ renderBannerList(); },200); };
  wire('mClose',closeModal);
  wire('lightbox',closeLightbox);
  var md=$('modal'); if(md)md.onclick=function(e){ if(e.target===this)closeModal(); };
  document.addEventListener('keydown',function(e){
    if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;
    if(e.key==='1')doPull(1);
    else if(e.key==='2')doPull(10);
    else if(e.key==='3')doUntil6();
    else if(e.key==='ArrowLeft')navBanner(-1);
    else if(e.key==='ArrowRight')navBanner(1);
    else if(e.key==='f'||e.key==='F'){ var cb=bannerById(state.cur); if(cb){ if(state.fav[cb.id])delete state.fav[cb.id]; else state.fav[cb.id]=true; save(); renderBannerList(); toast(state.fav[cb.id]?'⭐ 已收藏当前卡池':'已取消收藏'); } }
    else if(e.key==='g'||e.key==='G')openGallery();
    else if(e.key==='s'||e.key==='S')openStats();
    else if(e.key==='h'||e.key==='H'){ var hp=$('history'); if(hp&&hp.scrollIntoView)hp.scrollIntoView({behavior:'smooth',block:'start'}); }
  });
  var bl=$('bannerList');
  if(bl)bl.onclick=function(e){
    var t=e.target;
    if(t&&t.classList&&t.classList.contains('favbtn')){
      var fid=t.getAttribute('data-id');
      if(state.fav[fid])delete state.fav[fid]; else state.fav[fid]=true;
      save(); renderBannerList();
      return;
    }
    var c=e.target.closest?e.target.closest('.bcard'):null;
    if(c){ state.cur=c.getAttribute('data-id'); save(); renderBannerList(); renderBannerInfo(); renderStats(); if(isMobile())closeDrawer(); }
  };
  setChips($('colChips'),[['all','全部'],['miss','未拥有'],['lim','限定'],['favop','收藏'],['wish','心愿'],['6','6★'],['5','5★'],['4','4★'],['3','3★']],'all',function(){
    colF=$('colChips')._v; renderCollection();
  });
  setChips($('colProfChips'),[['all','职业:全部'],['先锋','先锋'],['近卫','近卫'],['重装','重装'],['狙击','狙击'],['术师','术师'],['医疗','医疗'],['辅助','辅助'],['特种','特种']],'all',function(){
    colP=$('colProfChips')._v; renderCollection();
  });
  var cs=$('colSortSel'); if(cs)cs.onchange=function(){ colSort=this.value; renderCollection(); };
  setChips($('histChips'),[['all','全部'],['6','6★'],['5','5★'],['4','4★'],['3','3★']],'all',function(){
    histF=$('histChips')._v; histRar='all'; var hrs0=$('histRarSel'); if(hrs0)hrs0.value='all'; histN=60; renderHistory();
  });
  setChips($('histTypeChips'),[['all','池:全部'],['limited','限定'],['event','活动'],['standard','标准'],['zhongjian','中坚'],['joint','联合行动'],['direct','定向甄选'],['zjselect','中坚甄选'],['special','特殊']],'all',function(){
    histT=$('histTypeChips')._v; histN=60; renderHistory();
  });
  setChips($('histTimeChips'),[['all','时间:全部'],['today','今天'],['week','本周'],['month','本月']],'all',function(){
    histTime=$('histTimeChips')._v; histN=60; renderHistory();
  });
  var hs=$('histSearch'); if(hs){ var hsDl=null; hs.oninput=function(){ histSearch=this.value.trim(); histN=60; clearTimeout(hsDl); hsDl=setTimeout(function(){ renderHistory(); },180); }; }
  var hcs=$('histClearSearch'); if(hcs)hcs.onclick=function(){ histSearch=''; var hs2=$('histSearch'); if(hs2)hs2.value=''; histN=60; renderHistory(); };
  var hgs=$('histGapSel'); if(hgs)hgs.onchange=function(){ histGap=this.value; histN=60; renderHistory(); };
  var hrs=$('histRarSel'); if(hrs)hrs.onchange=function(){ histRar=this.value; histF='all'; var hc0=$('histChips'); if(hc0){ hc0._v='all'; var cbs0=hc0.querySelectorAll('.chip'); for(var cbi0=0;cbi0<cbs0.length;cbi0++)cbs0[cbi0].classList.remove('on'); if(cbs0.length)cbs0[0].classList.add('on'); } histN=60; renderHistory(); };
}
init();
</script></body></html>
